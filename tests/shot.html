<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#888}iframe{border:0;width:390px;height:100vh;display:block;background:#fff}</style>
<iframe id="f"></iframe>
<script>
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const scenario = new URLSearchParams(location.search).get('s');
(async () => {
  const f = document.getElementById('f');
  f.src = '/index.html?sim=0';
  await new Promise((r) => (f.onload = r));
  await wait(500);
  const d = f.contentDocument, $ = (s) => d.querySelector(s);
  const sw = (id) => { const s = $('select[data-action=switch-user]'); s.value = id; s.dispatchEvent(new Event('change', { bubbles: true })); };
  if (scenario === 'recv') {
    $('[data-action=nudge][data-member=m-devon]').click(); await wait(300);
    sw('m-devon');
  } else if (scenario === 'mobile') {
    $('[data-action=sos][data-task=t1]').click(); await wait(200);
    $('[data-action=toggle-flag-menu][data-task=t2]').click(); await wait(200);
    $('[data-action=cheer][data-task=t7]').click();
  }
  await wait(1200);
})();
</script>
